plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}
group = 'za.co.fnb.dcre'
version = '2.0'
java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
repositories { mavenCentral(); mavenLocal() }
dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-batch'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jdbc'
    // The copybook layout tables and the fixed-width reader: a shared DEPENDENCY,
    // imported per service. crr, prr and mrr stay separate deployables.
    implementation 'za.co.fnb.dcre:platform-copybook:0.2.0'
    implementation 'za.co.fnb.dcre:platform-persistence:0.1.0'
    implementation 'org.liquibase:liquibase-core'
    implementation 'org.springframework.boot:spring-boot-liquibase'
    implementation 'za.co.fnb.dcre:platform-batch:0.2.0'
    runtimeOnly 'org.postgresql:postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.batch:spring-batch-test'
    testImplementation 'org.testcontainers:cockroachdb:1.21.4'
    testImplementation platform('io.cucumber:cucumber-bom:7.22.1')
    testImplementation 'io.cucumber:cucumber-java'
    testImplementation 'io.cucumber:cucumber-spring'
    testImplementation 'io.cucumber:cucumber-junit-platform-engine'
    testImplementation 'org.junit.platform:junit-platform-suite'
}
test { useJUnitPlatform() }

/*
 * Paketo buildpacks, NOT a hand-rolled prod JVM Dockerfile (estate mandate:
 * "ALL backend images via Paketo, never a prod JVM Dockerfile; BP_JVM_VERSION=25
 * mandatory"). PRR adopts it because a brand-new repo with zero tags and no
 * published image is the cheapest adoption point in the fleet: there is no
 * running image to keep byte-compatible and no rollback to preserve. The rest of
 * the fleet still ships CRR's hand-rolled Dockerfile and migrates separately.
 *
 * imageName has no registry prefix on purpose: dcre images are loaded straight
 * into the kind node with `kind load docker-image`, matching dcre-<svc>:<tag>.
 */
tasks.named('bootBuildImage') {
    imageName = "dcre-prr:${project.version}"
    // BOTH keys are pinned on purpose (rules/be/java/build.md). Leaving the
    // builder unset resolves correctly today, but only via the Boot plugin's
    // FLOATING default, so a plugin bump would silently change the base image of
    // the repo whose stated job is to be the fleet's Paketo exemplar.
    builder = 'paketobuildpacks/builder-noble-java-tiny'
    environment = ['BP_JVM_VERSION': '25']
}
